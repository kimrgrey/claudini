[package]
name = "claudini"
version = "0.1.0"
edition = "2021"
description = "CLI for switching Claude Code accounts"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
console = "0.15"
dirs = "6"
indicatif = "0.17"
keyring = { version = "3", features = ["apple-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
