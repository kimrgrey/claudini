[package]
name = "claudini"
version = "0.3.2"
edition = "2024"
description = "CLI for switching Claude Code accounts"
license = "MIT"
repository = "https://github.com/kimrgrey/claudini"
authors = ["Sergei Tsvetkov <tsvetkov@hey.com>"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
comfy-table = "7"
console = "0.15"
dirs = "6"
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
